[package]
name = "darkwave-desktop"
version = "0.1.0"
description = "Darkwave desktop shell"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "darkwave_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
audio-analysis = { path = "../../../crates/audio-analysis" }
audio-metadata = { path = "../../../crates/audio-metadata" }
backup = { path = "../../../crates/backup" }
command-palette = { path = "../../../crates/command-palette" }
export-pipeline = { path = "../../../crates/export-pipeline" }
fingerprint = { path = "../../../crates/fingerprint" }
import-pipeline = { path = "../../../crates/import-pipeline" }
library-core = { path = "../../../crates/library-core" }
library-sync = { path = "../../../crates/library-sync" }
maintenance = { path = "../../../crates/maintenance" }
preferences = { path = "../../../crates/preferences" }
release-readiness = { path = "../../../crates/release-readiness" }
search = { path = "../../../crates/search" }
shared-types = { path = "../../../crates/shared-types" }
storage = { path = "../../../crates/storage" }
uuid.workspace = true
workspace-state = { path = "../../../crates/workspace-state" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
trash = { path = "../../../crates/trash" }
tauri-plugin-shell = "2.3.5"
