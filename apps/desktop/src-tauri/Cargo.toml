[package]
name = "darkwave-desktop"
version = "0.1.0"
description = "Darkwave desktop shell"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "darkwave_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
library-core = { path = "../../../crates/library-core" }
preferences = { path = "../../../crates/preferences" }
release-readiness = { path = "../../../crates/release-readiness" }
viewport = { path = "../../../crates/viewport" }
workspace-state = { path = "../../../crates/workspace-state" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
