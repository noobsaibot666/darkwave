[package]
name = "darkwave-desktop"
version = "0.1.0"
description = "Darkwave desktop shell"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "darkwave_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
audio-analysis = { path = "../../../crates/audio-analysis" }
audio-metadata = { path = "../../../crates/audio-metadata" }
backup = { path = "../../../crates/backup" }
command-palette = { path = "../../../crates/command-palette" }
export-pipeline = { path = "../../../crates/export-pipeline" }
fingerprint = { path = "../../../crates/fingerprint" }
import-pipeline = { path = "../../../crates/import-pipeline" }
library-core = { path = "../../../crates/library-core" }
library-sync = { path = "../../../crates/library-sync" }
maintenance = { path = "../../../crates/maintenance" }
preferences = { path = "../../../crates/preferences" }
release-readiness = { path = "../../../crates/release-readiness" }
search = { path = "../../../crates/search" }
shared-types = { path = "../../../crates/shared-types" }
storage = { path = "../../../crates/storage" }
uuid.workspace = true
workspace-state = { path = "../../../crates/workspace-state" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
trash = { path = "../../../crates/trash" }
tauri-plugin-shell = "2.3.5"
tokio = { version = "1", default-features = false, features = ["time", "sync"] }
futures = { version = "0.3", default-features = false, features = ["std"] }

# direct-dist only (see src/license.rs) — kept optional so the Mac App
# Store build's dependency tree (and binary) carries none of this at all,
# not just dead code behind a cfg.
chrono = { workspace = true, optional = true }
ed25519-dalek = { version = "2", optional = true }
machine-uid = { version = "0.3", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
base64 = { version = "0.22", optional = true }
keyring = { version = "3", features = ["apple-native", "windows-native"], optional = true }

[features]
direct-dist = [
  "dep:chrono",
  "dep:ed25519-dalek",
  "dep:machine-uid",
  "dep:reqwest",
  "dep:base64",
  "dep:keyring",
]
