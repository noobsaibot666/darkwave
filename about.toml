# Every atomic SPDX identifier actually seen in `cargo metadata`'s full
# dependency graph (checked 2026-09-18 — see docs/adr/0034 for why this file
# exists at all). No GPL/AGPL family identifier appears anywhere in that
# graph, first-party or transitive.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "0BSD",
]

# This workspace's own crates are Proprietary (root Cargo.toml) — not a
# real SPDX identifier and not a third-party notice in the first place.
# None of them are published (no crate here has ever run `cargo publish`),
# so `private.ignore` correctly excludes every one of them from the report
# rather than needing "Proprietary" to be an "accepted" license alongside
# the actual third-party ones above.
ignore-dev-dependencies = true

[private]
ignore = true
