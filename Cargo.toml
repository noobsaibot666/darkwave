[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/audio-analysis",
  "crates/audio-engine",
  "crates/audio-metadata",
  "crates/export-pipeline",
  "crates/fingerprint",
  "crates/import-pipeline",
  "crates/library-core",
  "crates/release-readiness",
  "crates/library-sync",
  "crates/search",
  "crates/shared-types",
  "crates/storage",
  "crates/waveform"
]

[workspace.package]
edition = "2021"
license = "Proprietary"
repository = "https://github.com/noobsaibot666/darkwave"
rust-version = "1.80"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
